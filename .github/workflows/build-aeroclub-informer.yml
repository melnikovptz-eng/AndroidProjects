name: Build Aeroclub Informer APK
# Control build: unit tests, APK verification, then a real UI launch check on an accelerated emulator.
# A splash/home-screen screenshot is a failed UI test, never a successful artifact.

on:
  workflow_dispatch:
  push:
    branches:
      - aeroclub-informer
    paths:
      - 'Aeroclub/**'
      - '.github/workflows/build-aeroclub-informer.yml'

permissions:
  contents: read

concurrency:
  group: aeroclub-informer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android debug signing directory
        run: mkdir -p "$HOME/.android"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aeroclub-debug-keystore-v2
          enableCrossOsArchive: true
      - name: Ensure stable debug signing identity exists
        shell: bash
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -s "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          fi
          test -s "$KEYSTORE"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-30;google_apis;x86_64"
      - name: Verify Linux KVM hardware acceleration
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            echo "runner=$(uname -a)"
            echo "host_arch=$(uname -m)"
            if [ ! -e /dev/kvm ]; then
              echo "::error::GitHub runner does not expose /dev/kvm"
              exit 1
            fi
            echo "kvm_device=present"
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
            "$ANDROID_HOME/emulator/emulator" -accel-check
          } 2>&1 | tee diagnostics/emulator-environment.txt
          grep -Eiq "KVM.*installed and usable" diagnostics/emulator-environment.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run unit tests and build debug APK
        working-directory: Aeroclub
        run: >-
          gradle --no-daemon --stacktrace
          :core:common:test
          :core:data:testDebugUnitTest
          :core:ui:testDebugUnitTest
          :core:android:testDebugUnitTest
          :feature:notifications:testDebugUnitTest
          :feature:admin:testDebugUnitTest
          :feature:admin-flights:testDebugUnitTest
          :feature:admin-participants:testDebugUnitTest
          :feature:calendar:testDebugUnitTest
          :feature:messages:testDebugUnitTest
          :feature:settings:testDebugUnitTest
          :feature:informer:testDebugUnitTest
          :app:assembleDebug
      - name: Verify APK and write build manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="Aeroclub/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          PACKAGE_ID="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test "$PACKAGE_ID" = "ru.aeroclub.informer.mobile"
          "$APKSIGNER" verify "$APK"
          CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          KEY_CERT_SHA256="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          test -n "$CERT_SHA256"
          test -n "$KEY_CERT_SHA256"
          test "$CERT_SHA256" = "$KEY_CERT_SHA256"
          EXPECTED_CERT_SHA256="5167486c217aa60f9be53f2290ecca9b4f4f4c2b87d01483f4d51bc439d36db2"
          if [ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Aeroclub debug signing identity changed. Refusing to publish an APK that may not update existing installations."
            exit 1
          fi
          INFO="Aeroclub/app/build/outputs/apk/debug/build-info.txt"
          {
            echo "project_id=AEROCLUB"
            echo "project_name=KD PILOT"
            echo "branch=$GITHUB_REF_NAME"
            echo "source_sha=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "build_variant=debug"
            echo "application_id=$PACKAGE_ID"
            echo "apk_path=$APK"
            echo "apk_sha256=$APK_SHA256"
            echo "signing_certificate_sha256=$CERT_SHA256"
          } > "$INFO"
          cat "$INFO"
      - name: Publish the built APK before emulator acceptance
        uses: actions/upload-artifact@v4
        with:
          name: KD-PILOT-APK-${{ github.sha }}-run-${{ github.run_number }}
          path: |
            Aeroclub/app/build/outputs/apk/debug/app-debug.apk
            Aeroclub/app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
      - name: Read mandatory hardware acceleration policy before every emulator launch
        shell: bash
        run: |
          set -euo pipefail
          cat Aeroclub/EMULATOR_HARDWARE_ACCELERATION.md
          grep -Fq -- '-accel on' Aeroclub/EMULATOR_HARDWARE_ACCELERATION.md
          grep -Fq -- '-gpu host' Aeroclub/EMULATOR_HARDWARE_ACCELERATION.md
      - name: Preflight host GPU device before emulator launch
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking physical GPU access required by -gpu host"
          if [ ! -d /dev/dri ] || ! compgen -G '/dev/dri/renderD*' >/dev/null; then
            echo "::error::This GitHub-hosted runner exposes KVM but no DRM render node. A real host-GPU UI test cannot run here; refusing to fall back to software rendering."
            exit 1
          fi
          ls -l /dev/dri
          if command -v vulkaninfo >/dev/null 2>&1; then
            vulkaninfo --summary
          else
            echo "vulkaninfo unavailable; emulator startup remains the authoritative GPU check"
          fi
      - name: Launch KD PILOT and verify the actual S12 flights home UI
        id: emulator_ui
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu host -accel on -memory 3072 -skin 720x1280
          emulator-boot-timeout: 900
          cores: 4
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p diagnostics
            adb shell dumpsys SurfaceFlinger > diagnostics/surfaceflinger-renderer.txt
            adb shell getprop ro.hardware.egl >> diagnostics/surfaceflinger-renderer.txt
            cat diagnostics/surfaceflinger-renderer.txt
            if grep -Eiq 'swiftshader|llvmpipe|software rasterizer' diagnostics/surfaceflinger-renderer.txt; then
              echo "::error::Software GPU renderer detected; hardware GPU rendering is required"
              exit 1
            fi
            python3 Aeroclub/scripts/ui_acceptance.py
      - name: Record emulator acceptance limitation
        if: failure() && steps.emulator_ui.outcome != 'success'
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            echo "ui_acceptance=FAILED_OR_UNAVAILABLE"
            echo "reason=KVM-accelerated Android emulator did not complete UI acceptance"
            echo "next_required_action=Inspect emulator boot diagnostics and resolve UI acceptance failure"
            echo "hardware_acceleration=KVM CPU virtualization and requested host GPU; renderer verification did not complete"
          } > diagnostics/ui-acceptance-skipped.txt

      - name: Upload APK and complete emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KD-PILOT-${{ github.sha }}-run-${{ github.run_number }}
          path: |
            Aeroclub/app/build/outputs/apk/debug/app-debug.apk
            Aeroclub/app/build/outputs/apk/debug/build-info.txt
            screenshots/
            diagnostics/
          if-no-files-found: warn
