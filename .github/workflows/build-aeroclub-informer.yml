name: Build Aeroclub Informer APK
# Run the control build manually after a complete logical implementation batch.
# Control build for current Aeroclub source, including calendar-first event-card flow and Downloads exchange.
# Avoid starting a new Android build for every small source/documentation commit.

on:
  workflow_dispatch:
  push:
    branches:
      - aeroclub-informer
    paths:
      - 'Aeroclub/**'
      - '.github/workflows/build-aeroclub-informer.yml'

permissions:
  contents: read

concurrency:
  group: aeroclub-informer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android debug signing directory
        run: mkdir -p "$HOME/.android"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aeroclub-debug-keystore-v2
      - name: Ensure stable debug signing identity exists
        shell: bash
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -s "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          fi
          test -s "$KEYSTORE"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run unit tests and build debug APK
        working-directory: Aeroclub
        run: >-
          gradle --no-daemon --stacktrace
          :core:common:test
          :core:data:testDebugUnitTest
          :core:ui:testDebugUnitTest
          :core:android:testDebugUnitTest
          :feature:notifications:testDebugUnitTest
          :feature:admin:testDebugUnitTest
          :feature:admin-flights:testDebugUnitTest
          :feature:admin-participants:testDebugUnitTest
          :feature:calendar:testDebugUnitTest
          :feature:messages:testDebugUnitTest
          :feature:settings:testDebugUnitTest
          :feature:informer:testDebugUnitTest
          :app:assembleDebug
      - name: Verify APK and write build manifest
        run: |
          APK="Aeroclub/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          PACKAGE_ID="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test "$PACKAGE_ID" = "ru.aeroclub.informer.mobile"
          "$APKSIGNER" verify "$APK"
          CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          KEY_CERT_SHA256="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          test -n "$CERT_SHA256"
          test -n "$KEY_CERT_SHA256"
          test "$CERT_SHA256" = "$KEY_CERT_SHA256"
          INFO="Aeroclub/app/build/outputs/apk/debug/build-info.txt"
          {
            echo "project_id=AEROCLUB"
            echo "project_name=Aeroclub Informer"
            echo "branch=$GITHUB_REF_NAME"
            echo "source_sha=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "build_variant=debug"
            echo "application_id=$PACKAGE_ID"
            echo "apk_path=$APK"
            echo "apk_sha256=$APK_SHA256"
            echo "signing_certificate_sha256=$CERT_SHA256"
          } > "$INFO"
          cat "$INFO"
      - uses: actions/upload-artifact@v4
        with:
          name: Aeroclub-Informer-debug-${{ github.sha }}
          path: |
            Aeroclub/app/build/outputs/apk/debug/app-debug.apk
            Aeroclub/app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
