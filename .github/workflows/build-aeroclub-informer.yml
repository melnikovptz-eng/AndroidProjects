name: Build Aeroclub Informer APK

on:
  push:
    branches: [main, aeroclub-informer]
    paths:
      - 'Aeroclub/**'
      - '.github/workflows/build-aeroclub-informer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: Aeroclub
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK
        run: |
          test -s Aeroclub/app/build/outputs/apk/debug/app-debug.apk
          sha256sum Aeroclub/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aeroclub-Informer-debug
          path: Aeroclub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
