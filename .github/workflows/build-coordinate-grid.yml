name: Build Coordinate Grid APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CoordinateGridAndroid/**'
      - '.github/workflows/build-coordinate-grid.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          build-root-directory: CoordinateGridAndroid
          arguments: assembleDebug

      - name: Verify APK and write build manifest
        run: |
          APK="CoordinateGridAndroid/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          INFO="CoordinateGridAndroid/app/build/outputs/apk/debug/build-info.txt"
          {
            echo "project_id=COORDGRID"
            echo "project_name=Coordinate Grid Android"
            echo "branch=$GITHUB_REF_NAME"
            echo "source_sha=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "build_variant=debug"
            echo "application_id=com.pmca.coordinategrid"
            echo "apk_path=$APK"
            echo "apk_sha256=$APK_SHA256"
          } > "$INFO"
          cat "$INFO"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoordinateGrid-debug-${{ github.sha }}
          path: |
            CoordinateGridAndroid/app/build/outputs/apk/debug/app-debug.apk
            CoordinateGridAndroid/app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
