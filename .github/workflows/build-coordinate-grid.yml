name: Build Coordinate Grid APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CoordinateGridAndroid/**'
      - '.github/workflows/build-coordinate-grid.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          build-root-directory: CoordinateGridAndroid
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoordinateGrid-debug
          path: CoordinateGridAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
