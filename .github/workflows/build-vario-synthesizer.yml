name: Build Vario Synthesizer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VarioSynthesizer/**'
      - '.github/workflows/build-vario-synthesizer.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          build-root-directory: VarioSynthesizer
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VarioSynthesizer-debug
          path: VarioSynthesizer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
