name: GPTSenderTest Android Build

on:
  push:
    branches: [main]
    paths:
      - "GPTSenderTest/**"
      - ".github/workflows/gptsender-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "GPTSenderTest/**"
      - ".github/workflows/gptsender-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GPTSenderTest APKs
    runs-on: ubuntu-latest
    env:
      GPTSENDER_SIGNING_AVAILABLE: ${{ secrets.GPTSENDER_KEYSTORE_B64 != '' && secrets.GPTSENDER_STORE_PASSWORD != '' && secrets.GPTSENDER_KEY_ALIAS != '' && secrets.GPTSENDER_KEY_PASSWORD != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build GPTSenderTest debug APK
        working-directory: GPTSenderTest
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify debug APK and write build manifest
        run: |
          APK="GPTSenderTest/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          INFO="GPTSenderTest/app/build/outputs/apk/debug/build-info.txt"
          {
            echo "project_id=GPTSENDER"
            echo "project_name=GPTSenderTest"
            echo "branch=$GITHUB_REF_NAME"
            echo "source_sha=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "build_variant=debug"
            echo "application_id=com.test.gptsender"
            echo "apk_path=$APK"
            echo "apk_sha256=$APK_SHA256"
          } > "$INFO"
          cat "$INFO"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5

      - name: Upload GPTSenderTest debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GPTSenderTest-debug-apk-${{ github.sha }}
          path: |
            GPTSenderTest/app/build/outputs/apk/debug/app-debug.apk
            GPTSenderTest/app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Prepare persistent signing key
        if: env.GPTSENDER_SIGNING_AVAILABLE == 'true'
        env:
          GPTSENDER_KEYSTORE_B64: ${{ secrets.GPTSENDER_KEYSTORE_B64 }}
          GPTSENDER_STORE_PASSWORD: ${{ secrets.GPTSENDER_STORE_PASSWORD }}
          GPTSENDER_KEY_ALIAS: ${{ secrets.GPTSENDER_KEY_ALIAS }}
          GPTSENDER_KEY_PASSWORD: ${{ secrets.GPTSENDER_KEY_PASSWORD }}
        run: |
          set -e
          echo "$GPTSENDER_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gptsender-release.jks"
          test -s "$RUNNER_TEMP/gptsender-release.jks"
          echo "::add-mask::$GPTSENDER_STORE_PASSWORD"
          echo "::add-mask::$GPTSENDER_KEY_PASSWORD"
          echo "GPTSENDER_KEYSTORE_FILE=$RUNNER_TEMP/gptsender-release.jks" >> "$GITHUB_ENV"
          echo "GPTSENDER_STORE_PASSWORD=$GPTSENDER_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "GPTSENDER_KEY_ALIAS=$GPTSENDER_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GPTSENDER_KEY_PASSWORD=$GPTSENDER_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed GPTSenderTest release APK
        if: env.GPTSENDER_SIGNING_AVAILABLE == 'true'
        working-directory: GPTSenderTest
        env:
          GPTSENDER_KEYSTORE_FILE: ${{ runner.temp }}/gptsender-release.jks
          GPTSENDER_STORE_PASSWORD: ${{ secrets.GPTSENDER_STORE_PASSWORD }}
          GPTSENDER_KEY_ALIAS: ${{ secrets.GPTSENDER_KEY_ALIAS }}
          GPTSENDER_KEY_PASSWORD: ${{ secrets.GPTSENDER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signed release APK and write build manifest
        if: env.GPTSENDER_SIGNING_AVAILABLE == 'true'
        run: |
          APK="GPTSenderTest/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          INFO="GPTSenderTest/app/build/outputs/apk/release/build-info.txt"
          {
            echo "project_id=GPTSENDER"
            echo "project_name=GPTSenderTest"
            echo "branch=$GITHUB_REF_NAME"
            echo "source_sha=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "build_variant=release"
            echo "application_id=com.test.gptsender"
            echo "apk_path=$APK"
            echo "apk_sha256=$APK_SHA256"
          } > "$INFO"
          cat "$INFO"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload signed GPTSenderTest APK
        if: env.GPTSENDER_SIGNING_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GPTSenderTest-signed-apk-${{ github.sha }}
          path: |
            GPTSenderTest/app/build/outputs/apk/release/app-release.apk
            GPTSenderTest/app/build/outputs/apk/release/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Explain unsigned build fallback
        if: env.GPTSENDER_SIGNING_AVAILABLE != 'true'
        run: echo "Signing secrets are not configured; GPTSenderTest-debug-apk was built and uploaded."
