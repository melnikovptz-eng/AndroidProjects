name: GPTSenderTest Android Build

on:
  push:
    branches:
      - main
    paths:
      - "GPTSenderTest/**"
      - ".github/workflows/gptsender-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GPTSenderTest debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: GPTSenderTest
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GPTSenderTest-debug-apk
          path: GPTSenderTest/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
