name: GPTSenderTest Android Build

on:
  push:
    branches:
      - main
    paths:
      - "GPTSenderTest/**"
      - ".github/workflows/gptsender-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GPTSenderTest signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare persistent signing key
        env:
          GPTSENDER_KEYSTORE_B64: ${{ secrets.GPTSENDER_KEYSTORE_B64 }}
          GPTSENDER_STORE_PASSWORD: ${{ secrets.GPTSENDER_STORE_PASSWORD }}
          GPTSENDER_KEY_ALIAS: ${{ secrets.GPTSENDER_KEY_ALIAS }}
          GPTSENDER_KEY_PASSWORD: ${{ secrets.GPTSENDER_KEY_PASSWORD }}
        run: |
          set -e
          for name in GPTSENDER_KEYSTORE_B64 GPTSENDER_STORE_PASSWORD GPTSENDER_KEY_ALIAS GPTSENDER_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          echo "$GPTSENDER_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gptsender-release.jks"
          test -s "$RUNNER_TEMP/gptsender-release.jks"
          echo "GPTSENDER_KEYSTORE_FILE=$RUNNER_TEMP/gptsender-release.jks" >> "$GITHUB_ENV"
          echo "GPTSENDER_STORE_PASSWORD=$GPTSENDER_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "GPTSENDER_KEY_ALIAS=$GPTSENDER_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GPTSENDER_KEY_PASSWORD=$GPTSENDER_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: GPTSenderTest
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: GPTSenderTest-signed-apk
          path: GPTSenderTest/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
