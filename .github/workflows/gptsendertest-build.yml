name: GPTSenderTest Android Build

on:
  push:
    branches:
      - "gptsender/**"
    paths:
      - "GPTSenderTest/**"
      - ".github/workflows/gptsendertest-build.yml"
  pull_request:
    paths:
      - "GPTSenderTest/**"
      - ".github/workflows/gptsendertest-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gptsender-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile GPTSenderTest debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require persistent signing secrets for installable APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.GPTSENDER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GPTSENDER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GPTSENDER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GPTSENDER_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing GPTSENDER_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing GPTSENDER_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing GPTSENDER_KEY_ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing GPTSENDER_KEY_PASSWORD repository secret"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/gptsender-signing.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || { echo "::error::Keystore decode failed"; exit 1; }
          echo "GPTSENDER_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "GPTSENDER_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "GPTSENDER_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GPTSENDER_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Gradle wrapper
        working-directory: GPTSenderTest
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Compile debug APK
        working-directory: GPTSenderTest
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: GPTSenderTest-debug-apk
          path: GPTSenderTest/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
