name: GPTSenderTest Android Build

on:
  push:
    branches:
      - "gptsender/**"
    paths:
      - "GPTSenderTest/**"
      - ".github/workflows/gptsendertest-build.yml"
  pull_request:
    paths:
      - "GPTSenderTest/**"
      - ".github/workflows/gptsendertest-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile GPTSenderTest debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Gradle wrapper
        working-directory: GPTSenderTest
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Compile debug APK
        working-directory: GPTSenderTest
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GPTSenderTest-debug-apk
          path: GPTSenderTest/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
