name: PMCA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'PMCA/AndroidBridge/**'
      - '.github/workflows/pmca-android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build PMCA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Gradle wrapper
        working-directory: PMCA/AndroidBridge
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Prepare signing key
        env:
          PMCA_KEYSTORE_BASE64: ${{ secrets.PMCA_KEYSTORE_BASE64 }}
          PMCA_KEYSTORE_PASSWORD: ${{ secrets.PMCA_KEYSTORE_PASSWORD }}
          PMCA_KEY_PASSWORD: ${{ secrets.PMCA_KEY_PASSWORD }}
          PMCA_KEY_ALIAS: ${{ secrets.PMCA_KEY_ALIAS }}
        run: |
          set -eu
          test -n "$PMCA_KEYSTORE_BASE64"
          test -n "$PMCA_KEYSTORE_PASSWORD"
          test -n "$PMCA_KEY_PASSWORD"
          test -n "$PMCA_KEY_ALIAS"
          echo "$PMCA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pmca-release.jks"
          chmod 600 "$RUNNER_TEMP/pmca-release.jks"
          echo "::add-mask::$PMCA_KEYSTORE_PASSWORD"
          echo "::add-mask::$PMCA_KEY_PASSWORD"
          echo "Signing key prepared"

      - name: Build signed Release APK
        working-directory: PMCA/AndroidBridge
        env:
          PMCA_KEYSTORE_PATH: ${{ runner.temp }}/pmca-release.jks
          PMCA_KEYSTORE_PASSWORD: ${{ secrets.PMCA_KEYSTORE_PASSWORD }}
          PMCA_KEY_PASSWORD: ${{ secrets.PMCA_KEY_PASSWORD }}
          PMCA_KEY_ALIAS: ${{ secrets.PMCA_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signed APK
        run: |
          APK="PMCA/AndroidBridge/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PMCA-release-apk
          path: PMCA/AndroidBridge/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
