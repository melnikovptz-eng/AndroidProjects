name: PMCA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'PMCA/AndroidBridge/**'
      - '.github/workflows/pmca-android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build PMCA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Verify Gradle wrapper
        working-directory: PMCA/AndroidBridge
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        working-directory: PMCA/AndroidBridge
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="PMCA/AndroidBridge/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PMCA-debug-apk
          path: PMCA/AndroidBridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
