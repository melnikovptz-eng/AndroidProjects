name: VoiceActivation Android build

on:
  push:
    branches:
      - voice-activation
      - voice-activation-rebuild
      - voice-activation-capture-thread-fix
    paths:
      - "VoiceActivation/android-app/**"
      - "VoiceActivation/VoiceActivationNext/**"
      - ".github/workflows/voice-activation-build.yml"
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: VoiceActivation/VoiceActivationNext
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceActivation-Next-debug
          path: VoiceActivation/VoiceActivationNext/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
