name: Voice Calibration APK

on:
  workflow_dispatch:
  push:
    branches:
      - voice-calibration-rebuild
    paths:
      - 'VoiceActivation/CalibrationApp/**'
      - '.github/workflows/voice-calibration-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: gradle -p VoiceActivation/CalibrationApp testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle -p VoiceActivation/CalibrationApp assembleDebug --no-daemon

      - name: Verify APK package and file
        run: |
          APK="VoiceActivation/CalibrationApp/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceActivation-Calibration-debug
          path: VoiceActivation/CalibrationApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
