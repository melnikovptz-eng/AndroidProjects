name: VoiceActivation-Next Android build

on:
  push:
    branches: [voiceactivation-next-ci]
    paths:
      - 'VoiceActivation-Next/**'
      - '.github/workflows/voiceactivation-next.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        working-directory: VoiceActivation-Next
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: VoiceActivation-Next
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="VoiceActivation-Next/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          aapt dump badging "$APK" | grep -E "package: name='ru.voiceactivation.next'|versionCode='1'|versionName='1.0.0'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceActivation-Next-debug
          path: VoiceActivation-Next/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
