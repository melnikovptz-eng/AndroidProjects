plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pmca.bridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pmca.bridge'
        minSdk 23
        targetSdk 28
        versionCode 6
        versionName "0.5.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
