plugins {
id 'com.android.application'
}

android {
namespace 'com.pmca.bridge'
compileSdk 35

defaultConfig {
    applicationId 'com.pmca.bridge'
    minSdk 23
    targetSdk 28
    versionCode 6
    versionName "0.5.0"
}

signingConfigs {
    release {
        storeFile file(System.getenv("PMCA_KEYSTORE_PATH"))
        storePassword System.getenv("PMCA_KEYSTORE_PASSWORD")
        keyAlias System.getenv("PMCA_KEY_ALIAS")
        keyPassword System.getenv("PMCA_KEY_PASSWORD")
    }
}

buildTypes {
    release {
        signingConfig signingConfigs.release
    }
}

compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

}
