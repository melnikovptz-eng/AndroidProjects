plugins {
    id 'com.android.application'
}

def signingStoreFile = System.getenv('PMCA_KEYSTORE_PATH')
def signingStorePassword = System.getenv('PMCA_KEYSTORE_PASSWORD')
def signingKeyAlias = System.getenv('PMCA_KEY_ALIAS')
def signingKeyPassword = System.getenv('PMCA_KEY_PASSWORD')
def hasReleaseSigning = signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace 'com.pmca.bridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pmca.bridge'
        minSdk 23
        targetSdk 28
        versionCode 6
        versionName "0.5.0"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
